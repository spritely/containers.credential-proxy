name: Build and Publish Container

on: [push, workflow_dispatch]

permissions:
    checks: write # Required for test reporting
    contents: write # Required for pushing tags

jobs:
  build:
    # Available runners: https://github.com/actions/runner-images
    runs-on: ubuntu-26.04

    steps:
      - id: version
        name: Get semantic version
        uses: spritely/actions.semantic-version/get@9bb7602cb9b1bb80d710bca1f3b22a289070bf8c # v0.8.71
        with:
          writeSummary: true

      - name: Run tests
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        # The devcontainers CLI generates its Dockerfile outside the build context, which
        # newer buildx refuses to read unless the entitlement is granted up front.
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
        with:
          runCmd: |
            uv run pytest --junitxml=report.xml
          push: never

      - name: Generate test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Test Results
          path: report.xml
          reporter: java-junit

      - name: Build and publish container
        uses: spritely/actions.publish-container@5d7718200df9bb7caeedc9dc0cdcffe24130a610 # v0.2.137
        with:
          registryUsername: ${{ secrets.DOCKER_HUB_USERNAME }}
          registryPassword: ${{ secrets.DOCKER_HUB_TOKEN }}
          registryHost: docker.io
          context: ./src
          dockerfile: ./src/Containerfile
          imageNames: spritelydev/credentials-proxy
          version: ${{ steps.version.outputs.version }}
          writeSummary: true

      - name: Apply semantic version
        if: ${{ steps.version.outputs.branchName == github.event.repository.default_branch }}
        uses: spritely/actions.semantic-version/apply@9bb7602cb9b1bb80d710bca1f3b22a289070bf8c # v0.8.71
        with:
          version: ${{ steps.version.outputs.version }}
