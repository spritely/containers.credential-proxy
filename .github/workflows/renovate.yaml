name: Renovate

on:
  workflow_dispatch:
    inputs:
      renovateVersion:
        description: The version of Renovate to use. Leave empty to use the latest version.
        required: false
        default: ''
      renovateLogLevel:
        description: The log level for Renovate.
        required: false
        default: info
        type: choice
        options:
          - trace
          - debug
          - info
          - warn
          - error
          - fatal

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - name: Generate token
        id: renovate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.renovate-token.outputs.token }}
          renovate-version: ${{ inputs.renovateVersion }}
        env:
          LOG_LEVEL: ${{ inputs.renovateLogLevel }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: false
